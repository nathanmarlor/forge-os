name: Unit Test
on: [push, pull_request]

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: esp-idf build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: latest
        target: esp32s3
        command: GITHUB_ACTIONS="true" idf.py build
        path: 'test-ci'
    - name: Fix flash_args for QEMU action
      run: |
        # Strip --flash-mode/freq/size flags that newer IDF adds to flash_args
        # The QEMU action's merge_bin call can't handle them
        # Use sudo because the build dir was created inside the Docker container as root
        sudo sed -i '/^--flash/d' test-ci/build/flash_args
    - name: Run tests and show result
      uses: bitaxeorg/esp32-qemu-test-action@main
      with:
        path: 'test-ci'
    - name: Find and fix report.xml
      if: always()
      run: |
        echo "=== Searching for report.xml ==="
        find . -name 'report.xml' -type f -ls 2>/dev/null || true
        # The QEMU action writes to /github/workspace inside Docker,
        # which maps to the repo root. Fix permissions if needed.
        if [ -f report.xml ]; then
          echo "=== Found at ./report.xml ==="
          sudo chmod 644 report.xml 2>/dev/null || true
          cat report.xml
        elif [ -f test-ci/report.xml ]; then
          echo "=== Found at test-ci/report.xml ==="
          sudo cp test-ci/report.xml report.xml
          cat report.xml
        elif [ -f test-ci/build/report.xml ]; then
          echo "=== Found at test-ci/build/report.xml ==="
          sudo cp test-ci/build/report.xml report.xml
          cat report.xml
        else
          echo "=== report.xml not found anywhere ==="
          ls -la . test-ci/ test-ci/build/ 2>/dev/null || true
        fi
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v1
      if: always()
      with:
          files: report.xml
